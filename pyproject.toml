[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nearextremal-threshold"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "tqdm>=4.66,<5.0",
]